# The tests, on every change.
#
# hosigraph, with its khana on Datalevin in a resident JVM: the standalone jar, checked against a
# pinned sha256. The native `dtlv` is not used here, so the tests that need it print that they
# skipped them (see "Run the tests against Datalevin" in docs/guide.md).
# takka/ (the words hosigraph shares with Datalevin) is built along with it.
#
# setu/ (writes the doors other languages use) and hosigraph-abi/ (hosigraph behind a C ABI) are
# tried here too: their Haskell tests, and a check that the generated files in hosigraph-abi/gen
# are what the description gives.  The shared library itself (libhosi) is built and run against
# the ctypes conformance in a job of its own, `abi`: it has been seen to pass on macOS only.
name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GHC_VERSION: "9.10.3"
  CABAL_VERSION: "3.14.2.0"
  DATALEVIN_VERSION: "1.2.10"
  # sha256 of datalevin-1.2.10-standalone.jar, from the release page of datalevin/datalevin
  DATALEVIN_JAR_SHA256: "0e8aba6d4022e63e9b34eafc39e257d1efa8ec2a920f089836c459e987605513"

jobs:
  # The Haskell side, built once: hosigraph, takka, setu, hosigraph-abi and libhosi.  What it builds is
  # saved in the cache under this commit, and `test` and `ecto` start from it instead of building again.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('hosigraph.cabal', 'takka/takka.cabal', 'setu/setu.cabal', 'hosigraph-abi/hosigraph-abi.cabal') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('hosigraph.cabal', 'takka/takka.cabal', 'setu/setu.cabal', 'hosigraph-abi/hosigraph-abi.cabal') }}-
            cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-

      - name: Build
        run: |
          cabal update
          cabal build --enable-tests hosigraph takka setu \
            hosigraph-abi:lib:hosigraph-abi hosigraph-abi:exe:hosigraph-abi-gen hosigraph-abi:test:spec \
            hosigraph-abi:flib:hosi

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('hosigraph.cabal', 'takka/takka.cabal', 'setu/setu.cabal', 'hosigraph-abi/hosigraph-abi.cabal') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('hosigraph.cabal', 'takka/takka.cabal', 'setu/setu.cabal', 'hosigraph-abi/hosigraph-abi.cabal') }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the Datalevin jar
        run: |
          jar="$RUNNER_TEMP/datalevin-${DATALEVIN_VERSION}-standalone.jar"
          curl -fsSL -o "$jar" \
            "https://github.com/datalevin/datalevin/releases/download/${DATALEVIN_VERSION}/datalevin-${DATALEVIN_VERSION}-standalone.jar"
          echo "${DATALEVIN_JAR_SHA256}  ${jar}" | sha256sum -c -
          echo "HOSIGRAPH_DATALEVIN_JAR=${jar}" >> "$GITHUB_ENV"
          echo "HOSIGRAPH_JAVA=${JAVA_HOME}/bin/java" >> "$GITHUB_ENV"

      # not `all`: that would build the shared library too, which has its own job below
      - name: Build
        run: |
          cabal update
          cabal build --enable-tests hosigraph takka setu \
            hosigraph-abi:lib:hosigraph-abi hosigraph-abi:exe:hosigraph-abi-gen hosigraph-abi:test:spec

      - name: Test
        run: cabal test hosigraph:spec setu:spec hosigraph-abi:spec --test-show-details=direct

      - name: Are the generated files up to date?
        run: cabal run hosigraph-abi:exe:hosigraph-abi-gen -- --check hosigraph-abi/gen

  # libhosi: the shared library, tried through ctypes with a fake database (no JVM here).
  abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Only macOS (arm64) has run this so far.  Let it fail without turning the whole run red,
    # until it has been seen green on Linux once; then take this line out.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: cabal-abi-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('hosigraph.cabal', 'takka/takka.cabal', 'setu/setu.cabal', 'hosigraph-abi/hosigraph-abi.cabal') }}
          restore-keys: |
            cabal-abi-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-

      - name: Build libhosi
        run: |
          cabal update
          cabal build hosigraph-abi:flib:hosi

      - name: Conformance (T-01 to T-14, through ctypes)
        run: |
          lib=$(find dist-newstyle -type f -name 'libhosi.so*' | head -n 1)
          echo "library: $lib"
          python3 -I hosigraph-abi/test/abi_conformance.py "$lib"

  # ecto_hosi (ecto_hosi/) against the real thing: the libhosi built above, hosigraph-ex's NIF on it, and
  # Datalevin in a resident JVM.  The adapter's quick run on its in-memory stand-in is ecto-hosi.yml.
  ecto:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # libhosi has not been run on Linux in CI before (see `abi`).  Let it fail without turning the
    # whole run red, until it has been seen green once; then take this line out.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('hosigraph.cabal', 'takka/takka.cabal', 'setu/setu.cabal', 'hosigraph-abi/hosigraph-abi.cabal') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('hosigraph.cabal', 'takka/takka.cabal', 'setu/setu.cabal', 'hosigraph-abi/hosigraph-abi.cabal') }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Fetch the Datalevin jar
        run: |
          jar="$RUNNER_TEMP/datalevin-${DATALEVIN_VERSION}-standalone.jar"
          curl -fsSL -o "$jar" \
            "https://github.com/datalevin/datalevin/releases/download/${DATALEVIN_VERSION}/datalevin-${DATALEVIN_VERSION}-standalone.jar"
          echo "${DATALEVIN_JAR_SHA256}  ${jar}" | sha256sum -c -
          echo "HOSI_JAR=${jar}" >> "$GITHUB_ENV"
          echo "HOSI_JAVA=${JAVA_HOME}/bin/java" >> "$GITHUB_ENV"

      - name: libhosi and the NIF
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf
          cabal build hosigraph-abi:flib:hosi
          lib=$(find dist-newstyle -type f -name 'libhosi.so*' | head -n 1)
          echo "library: $lib"
          hosigraph-ex/scripts/bundle-libhosi.sh "$lib" "$PWD/hosigraph-ex/priv"
          cd hosigraph-ex
          HOSI_BUILD=source HOSI_LIB_DIR="$PWD/priv" HOSI_INCLUDE_DIR="$PWD/../hosigraph-abi/gen/include" mix compile

      - name: ecto_hosi on hosigraph and Datalevin
        working-directory: ecto_hosi
        env:
          HOSI_REAL: "1"
          HOSI_BUILD: none   # priv/ of hosigraph-ex is already filled in above
        run: |
          mix deps.get
          mix test
